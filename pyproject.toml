[project]
name = "electionforensics"
dynamic = ["version"]
description = "Analysis, detection and presentation of election distortions from public data; first application: Knesset elections (Israel)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Raveh Neeman" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "pyarrow>=15",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "plotly>=5.20",
  "matplotlib>=3.8",
  "python-bidi>=0.4",
  "jinja2>=3.1",
  "httpx>=0.27",
  "feedparser>=6.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
]

[project.scripts]
ef = "electionforensics.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/electionforensics/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/electionforensics"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = [".claude"]  # worktrees of parallel Claude Code sessions live under .claude/worktrees/

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]
"src/electionforensics/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
files = ["src/electionforensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
